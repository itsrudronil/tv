<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Web TV Player</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- HLS.js for streaming -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

    <!-- Mobile Header Toggle -->
    <div class="mobile-header">
        <button id="sidebar-toggle" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
        <h2>Pro TV Player</h2>
    </div>

    <div id="dashboard-container">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h3><i class="fa-solid fa-tv"></i> Live TV</h3>
                <button class="close-btn" onclick="toggleSidebar()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search" placeholder="Search channel..." onkeyup="filterChannels()">
            </div>

            <!-- Category Filter Tabs -->
            <div class="categories" id="category-tabs">
                <button class="cat-btn active" onclick="filterCategory('All')">All</button>
                <button class="cat-btn" onclick="filterCategory('Sports')">Sports</button>
                <button class="cat-btn" onclick="filterCategory('News')">News</button>
                <button class="cat-btn" onclick="filterCategory('Movies')">Movies</button>
            </div>

            <ul id="channel-list">
                <!-- Channels will load here -->
            </ul>
        </div>

        <!-- Main Player Section -->
        <div class="main-player">
            <div class="player-wrapper">
                <h2 id="current-channel-name"><i class="fa-solid fa-circle-play"></i> Select a channel to watch</h2>
                <div class="video-container">
                    <video id="video-player" controls autoplay></video>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
