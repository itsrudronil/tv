<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Xtream Web Player</title>
    <!-- Video.js Player CSS -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <style>
        body {
            margin: 0;
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 300px;
            background: #1e1e1e;
            padding: 15px;
            overflow-y: auto;
            border-right: 1px solid #333;
        }
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .channel-item {
            padding: 10px;
            margin-bottom: 5px;
            background: #2a2a2a;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
        }
        .channel-item:hover {
            background: #3a3a3a;
        }
        .video-container {
            width: 100%;
            max-width: 900px;
        }
    </style>
</head>
<body>

    <!-- Sidebar for Channel List -->
    <div class="sidebar">
        <h3>Live Channels</h3>
        <div id="channel-list">Loading channels...</div>
    </div>

    <!-- Main Player Area -->
    <div class="main-content">
        <div class="video-container">
            <video-js id="my-player" class="vjs-big-play-centered" controls preload="auto" width="854" height="480">
                <p class="vjs-no-js">To view this video please enable JavaScript, and consider upgrading to a web browser that supports HTML5 video</p>
            </video-js>
        </div>
    </div>

    <!-- Video.js Script -->
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script>
        // ================= CONFIGURATION =================
        const SERVER_URL = "http://starter.nvisionbd.net"; // Apnar Xtream Server URL
        const USERNAME = "talukderrudronil";                   // Apnar Username
        const PASSWORD = "talRudronil8";                   // Apnar Password
        // ==================================================

        var player = videojs('my-player');

        // Fetch Live Streams from Xtream API
        async function loadChannels() {
            const apiURL = `${SERVER_URL}/player_api.php?username=${USERNAME}&password=${PASSWORD}&action=get_live_streams`;
            
            try {
                let response = await fetch(apiURL);
                let channels = await response.json();
                
                let listContainer = document.getElementById('channel-list');
                listContainer.innerHTML = "";

                if(Array.isArray(channels)) {
                    channels.forEach(channel => {
                        let div = document.createElement('div');
                        div.className = 'channel-item';
                        div.innerText = channel.name;
                        div.onclick = () => playChannel(channel.stream_id);
                        listContainer.appendChild(div);
                    });
                } else {
                    listContainer.innerText = "Failed to load channels. Check credentials.";
                }
            } catch (error) {
                console.error("Error fetching channels:", error);
                document.getElementById('channel-list').innerText = "Error connecting to server.";
            }
        }

        // Play Selected Channel
        function playChannel(streamId) {
            // Xtream Codes live stream link format (.m3u8 for HLS)
            let streamURL = `${SERVER_URL}/live/${USERNAME}/${PASSWORD}/${streamId}.m3u8`;
            player.src({ src: streamURL, type: 'application/x-mpegURL' });
            player.play();
        }

        // Initialize on load
        loadChannels();
    </script>
</body>
</html>
