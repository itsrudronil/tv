<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xtream Live IPTV Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #fff; padding: 12px; }
    .container { max-width: 800px; margin: 0 auto; background: #1e293b; padding: 15px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    h2 { text-align: center; color: #38bdf8; margin-bottom: 15px; font-size: 20px; }
    
    .player-box { background: #000; border-radius: 8px; overflow: hidden; position: relative; aspect-ratio: 16 / 9; }
    video { width: 100%; height: 100%; display: block; }
    .now-playing { background: #0f172a; padding: 8px 12px; font-size: 13px; color: #38bdf8; border-radius: 6px; margin: 10px 0; text-align: center; font-weight: 500; }

    .filter-section { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    select, input { flex: 1; min-width: 140px; padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 13px; outline: none; }
    
    .loading { text-align: center; padding: 20px; color: #facc15; font-size: 14px; background: #451a03; border-radius: 8px; margin-top: 10px; border: 1px solid #b45309; }
    .channel-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; max-height: 350px; overflow-y: auto; padding-right: 4px; }
    .channel-card { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 8px; text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; height: 90px; }
    .channel-card:active { border-color: #38bdf8; background: #1e293b; }
    .channel-card img { max-width: 40px; max-height: 40px; object-fit: contain; }
    .channel-card span { font-size: 11px; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  </style>
</head>
<body>

<div class="container">
  <h2>IPTV Web Player</h2>

  <div class="player-box">
    <video id="video" controls autoplay></video>
  </div>
  <div class="now-playing" id="currentChannel">চ্যানেল সিলেক্ট করুন...</div>

  <div class="filter-section">
    <select id="categorySelect" onchange="filterChannels()">
      <option value="all">সব ক্যাটাগরি</option>
    </select>
    <input type="text" id="searchInput" oninput="filterChannels()" placeholder="চ্যানেল খুঁজুন...">
  </div>

  <div id="loading" class="loading">অপেক্ষা করুন, চ্যানেল লোড হচ্ছে... (এতে কিছুক্ষণ সময় লাগতে পারে)</div>
  <div id="channelList" class="channel-list"></div>
</div>

<script>
  const proxy = "https://plain-art-ebfe.soumyadeeptalukderrudronil.workers.dev/?url=";
  const server = "http://dvltv.cc:80";
  const user = "talukderrudronil";
  const pass = "talRudronil8";

  let allChannels = [];
  let hlsInstance = null;

  window.onload = async () => {
    await loadCategories();
    await loadChannels();
  };

  async function loadCategories() {
    const apiUrl = `${server}/player_api.php?username=${user}&password=${pass}&action=get_live_categories`;
    try {
      const res = await fetch(proxy + encodeURIComponent(apiUrl));
      const textData = await res.text(); 
      
      try {
        const categories = JSON.parse(textData);
        const select = document.getElementById('categorySelect');
        categories.forEach(cat => {
          const opt = document.createElement('option');
          opt.value = cat.category_id;
          opt.textContent = cat.category_name;
          select.appendChild(opt);
        });
      } catch (parseErr) {
        console.error("JSON Error:", textData);
        document.getElementById('loading').innerHTML = "<b>Category Error:</b> সার্ভার ব্লক করেছে অথবা আইপি-লক করা আছে!";
      }
    } catch (err) {
      document.getElementById('loading').innerHTML = "<b>Proxy Error:</b> প্রক্সি কানেকশন ফেইল করেছে।";
    }
  }

  async function loadChannels() {
    const apiUrl = `${server}/player_api.php?username=${user}&password=${pass}&action=get_live_streams`;
    try {
      const res = await fetch(proxy + encodeURIComponent(apiUrl));
      const textData = await res.text();

      try {
        allChannels = JSON.parse(textData);

        if (allChannels && allChannels.user_info && allChannels.user_info.auth === 0) {
           document.getElementById('loading').innerHTML = "<b>Auth Error:</b> ইউজারনেম/পাসওয়ার্ড ভুল বা মেয়াদ শেষ!";
           return;
        }

        if(allChannels.length > 0) {
            document.getElementById('loading').style.display = 'none';
            renderChannels(allChannels);
        } else {
            document.getElementById('loading').innerHTML = "<b>Error:</b> চ্যানেল লিস্ট ফাঁকা আসছে!";
        }
      } catch (parseErr) {
        console.error("JSON parsing failed in Channels");
        document.getElementById('loading').innerHTML = "<b>API Error:</b> সার্ভার থেকে সঠিক ডাটা আসছে না। (হয়তো আপনার অ্যাকাউন্টটি অন্য আইপি বা প্রক্সির জন্য ব্লকড)";
      }

    } catch (err) {
      document.getElementById('loading').innerHTML = "<b>Network Error:</b> চ্যানেল লোড টাইম-আউট হয়েছে।";
    }
  }

  function filterChannels() {
    const selectedCategory = document.getElementById('categorySelect').value;
    const searchQuery = document.getElementById('searchInput').value.toLowerCase();

    const filtered = allChannels.filter(ch => {
      const matchCategory = (selectedCategory === 'all' || ch.category_id == selectedCategory);
      const matchSearch = ch.name.toLowerCase().includes(searchQuery);
      return matchCategory && matchSearch;
    });

    renderChannels(filtered);
  }

  function renderChannels(channels) {
    const listContainer = document.getElementById('channelList');
    listContainer.innerHTML = '';

    if (channels.length === 0) {
      listContainer.innerHTML = '<div style="color:red; text-align:center; grid-column: 1/-1;">কোনো চ্যানেল পাওয়া যায়নি!</div>';
      return;
    }

    channels.slice(0, 150).forEach(ch => {
      const card = document.createElement('div');
      card.className = 'channel-card';
      const iconUrl = ch.stream_icon ? proxy + encodeURIComponent(ch.stream_icon) : '';
      
      card.innerHTML = `
        ${ch.stream_icon ? `<img src="${iconUrl}" onerror="this.style.display='none'">` : ''}
        <span>${ch.name}</span>
      `;
      card.onclick = () => playChannel(ch.stream_id, ch.name);
      listContainer.appendChild(card);
    });
  }

    function playChannel(streamId, channelName) {
    document.getElementById('currentChannel').textContent = "এখন চলছে: " + channelName;
    
    // m3u8 এর বদলে .ts বা .m3u8 চেক করে প্লে করা
    const rawStreamUrl = `${server}/live/${user}/${pass}/${streamId}.m3u8`;
    const finalStreamUrl = proxy + encodeURIComponent(rawStreamUrl);
    const video = document.getElementById('video');

    if (hlsInstance) { 
      hlsInstance.destroy(); 
    }

    if (Hls.isSupported()) {
      // HLS কনফিগারেশনে xhrSetup যোগ করা হলো যেন প্রতিটি ফ্র্যাগমেন্টও প্রক্সির মাধ্যমে যায়
      hlsInstance = new Hls({
        xhrSetup: function(xhr, url) {
          // যদি URL প্রক্সির না হয়, তবে সেটিকেও প্রক্সির ভেতর দিয়ে পাস করানো
          if (!url.startsWith(proxy)) {
             xhr.open('GET', proxy + encodeURIComponent(url), true);
          } else {
             xhr.open('GET', url, true);
          }
        }
      });
      hlsInstance.loadSource(finalStreamUrl);
      hlsInstance.attachMedia(video);
      hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
         video.play().catch(e => console.log("Play error:", e));
      });
      
      // এরর ধরার জন্য
      hlsInstance.on(Hls.Events.ERROR, function (event, data) {
        if (data.fatal) {
          switch (data.type) {
            case Hls.ErrorTypes.NETWORK_ERROR:
              console.log("fatal network error encountered, try to recover");
              hlsInstance.startLoad();
              break;
            case Hls.ErrorTypes.MEDIA_ERROR:
              console.log("fatal media error encountered, try to recover");
              hlsInstance.recoverMediaError();
              break;
            default:
              hlsInstance.destroy();
              break;
          }
        }
      });
      
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = finalStreamUrl;
      video.addEventListener('loadedmetadata', () => {
         video.play().catch(e => console.log("Play error:", e));
      });
    }
    }
  }
</script>

</body>
</html>
