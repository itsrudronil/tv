<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Xtream Web Player</title>
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <style>
        body {
            margin: 0;
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 300px;
            background: #1e1e1e;
            padding: 15px;
            overflow-y: auto;
            border-right: 1px solid #333;
        }
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .channel-item {
            padding: 10px;
            margin-bottom: 5px;
            background: #2a2a2a;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
        }
        .channel-item:hover {
            background: #3a3a3a;
        }
        .video-container {
            width: 100%;
            max-width: 900px;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h3>Live Channels</h3>
        <div id="channel-list">Loading channels...</div>
    </div>

    <div class="main-content">
        <div class="video-container">
            <video-js id="my-player" class="vjs-big-play-centered" controls preload="auto" width="854" height="480">
                <p class="vjs-no-js">To view this video please enable JavaScript</p>
            </video-js>
        </div>
    </div>

    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script>
        // ================= CONFIGURATION =================
        const SERVER_URL = "http://dvltv.cc:80"; // Apnar Xtream Server URL
        const USERNAME = "talukderrudronil";       // Apnar Username
        const PASSWORD = "talRudronil8";       // Apnar Password (Boro hater PASSWORD)
        // ==================================================

        var player = videojs('my-player');

        async function loadChannels() {
            // Sothik variable (PASSWORD) use kora holo
            const directM3U = `${SERVER_URL}/get.php?username=${USERNAME}&password=${PASSWORD}&type=m3u`;

            try {
                let response = await fetch(`https://corsproxy.io/?${encodeURIComponent(directM3U)}`);
                let data = await response.text();
                
                let listContainer = document.getElementById('channel-list');
                listContainer.innerHTML = "";

                let lines = data.split('\n');
                let channels = [];
                
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].startsWith('#EXTINF:')) {
                        let nameMatch = lines[i].match(/tvg-name="([^"]*)"|,(.+)$/);
                        let name = nameMatch ? (nameMatch[1] || nameMatch[2]) : "Channel";
                        let url = lines[i + 1] ? lines[i + 1].trim() : "";
                        if (url) {
                            channels.push({ name: name, url: url });
                        }
                    }
                }

                if (channels.length > 0) {
                    channels.forEach(channel => {
                        let div = document.createElement('div');
                        div.className = 'channel-item';
                        div.innerText = channel.name;
                        div.onclick = () => playChannel(channel.url);
                        listContainer.appendChild(div);
                    });
                } else {
                    listContainer.innerText = "No channels found in playlist.";
                }
            } catch (error) {
                console.error("Error:", error);
                document.getElementById('channel-list').innerText = "Failed to load M3U playlist.";
            }
        }

        function playChannel(streamURL) {
            player.src({ src: streamURL, type: 'application/x-mpegURL' });
            player.play();
        }

        loadChannels();
    </script>
</body>
</html>
