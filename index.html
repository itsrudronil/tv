<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xtream Live IPTV Player</title>
  <!-- HLS.js Library -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #fff; padding: 12px; }
    .container { max-width: 800px; margin: 0 auto; background: #1e293b; padding: 15px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    h2 { text-align: center; color: #38bdf8; margin-bottom: 15px; font-size: 20px; }
    
    /* Player Layout */
    .player-box { background: #000; border-radius: 8px; overflow: hidden; position: relative; aspect-ratio: 16 / 9; }
    video { width: 100%; height: 100%; display: block; }
    .now-playing { background: #0f172a; padding: 8px 12px; font-size: 13px; color: #38bdf8; border-radius: 6px; margin: 10px 0; text-align: center; font-weight: 500; }

    /* Filters: Search & Category */
    .filter-section { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    select, input { flex: 1; min-width: 140px; padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 13px; outline: none; }
    
    /* Channel Grid & Loading State */
    .loading { text-align: center; padding: 15px; color: #facc15; font-size: 14px; background: #451a03; border-radius: 8px; margin-top: 10px; border: 1px solid #b45309; }
    .channel-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; max-height: 400px; overflow-y: auto; padding-right: 4px; margin-top: 10px;}
    .channel-card { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 8px; text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; height: 90px; transition: 0.2s; }
    .channel-card:active, .channel-card:hover { border-color: #38bdf8; background: #1e293b; }
    .channel-card img { max-width: 45px; max-height: 45px; object-fit: contain; }
    .channel-card span { font-size: 11px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    /* Custom Scrollbar for channel list */
    .channel-list::-webkit-scrollbar { width: 6px; }
    .channel-list::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
  </style>
</head>
<body>

<div class="container">
  <h2>Live TV Player</h2>

  <!-- Video Player Section -->
  <div class="player-box">
    <video id="video" controls autoplay playsinline></video>
  </div>
  <div class="now-playing" id="currentChannel">চ্যানেল সিলেক্ট করুন...</div>

  <!-- Filter Section -->
  <div class="filter-section">
    <select id="categorySelect" onchange="filterChannels()">
      <option value="all">সব ক্যাটাগরি</option>
    </select>
    <input type="text" id="searchInput" oninput="filterChannels()" placeholder="চ্যানেল খুঁজুন...">
  </div>

  <!-- Messages & Channel List -->
  <div id="loading" class="loading">অপেক্ষা করুন, চ্যানেল লিস্ট লোড হচ্ছে...</div>
  <div id="channelList" class="channel-list"></div>
</div>

<script>
  // আপনার ক্রেডেনশিয়াল এবং প্রক্সি লিংক
  const proxy = "https://plain-art-ebfe.soumyadeeptalukderrudronil.workers.dev/?url=";
  const server = "http://dvltv.cc:80";
  const user = "talukderrudronil";
  const pass = "talRudronil8";

  let allChannels = [];
  let hlsInstance = null;

  // পেজ লোড হওয়ার সাথে সাথে API কল করা
  window.onload = async () => {
    await loadCategories();
    await loadChannels();
  };

  // ক্যাটাগরি লোড করা
  async function loadCategories() {
    const apiUrl = `${server}/player_api.php?username=${user}&password=${pass}&action=get_live_categories`;
    try {
      const res = await fetch(proxy + encodeURIComponent(apiUrl));
      const textData = await res.text(); 
      
      try {
        const categories = JSON.parse(textData);
        const select = document.getElementById('categorySelect');
        categories.forEach(cat => {
          const opt = document.createElement('option');
          opt.value = cat.category_id;
          opt.textContent = cat.category_name;
          select.appendChild(opt);
        });
      } catch (parseErr) {
        console.error("JSON Error in Categories:", textData);
      }
    } catch (err) {
      console.error("Proxy Connect Error:", err);
    }
  }

  // লাইভ চ্যানেল লোড করা
  async function loadChannels() {
    const apiUrl = `${server}/player_api.php?username=${user}&password=${pass}&action=get_live_streams`;
    try {
      const res = await fetch(proxy + encodeURIComponent(apiUrl));
      const textData = await res.text();

      try {
        allChannels = JSON.parse(textData);

        if (allChannels && allChannels.user_info && allChannels.user_info.auth === 0) {
           document.getElementById('loading').innerHTML = "<b>Auth Error:</b> ইউজারনেম/পাসওয়ার্ড ভুল বা ব্লক করা হয়েছে!";
           return;
        }

        if(allChannels.length > 0) {
            document.getElementById('loading').style.display = 'none';
            renderChannels(allChannels);
        } else {
            document.getElementById('loading').innerHTML = "কোনো চ্যানেল পাওয়া যায়নি।";
        }
      } catch (parseErr) {
        document.getElementById('loading').innerHTML = "<b>API Error:</b> সার্ভার থেকে সঠিক ডাটা আসছে না।";
      }
    } catch (err) {
      document.getElementById('loading').innerHTML = "<b>Network Error:</b> ইন্টারনেট কানেকশন চেক করুন।";
    }
  }

  // চ্যানেল ফিল্টার (সার্চ এবং ক্যাটাগরি)
  function filterChannels() {
    const selectedCategory = document.getElementById('categorySelect').value;
    const searchQuery = document.getElementById('searchInput').value.toLowerCase();

    const filtered = allChannels.filter(ch => {
      const matchCategory = (selectedCategory === 'all' || ch.category_id == selectedCategory);
      const matchSearch = ch.name.toLowerCase().includes(searchQuery);
      return matchCategory && matchSearch;
    });

    renderChannels(filtered);
  }

  // স্ক্রিনে চ্যানেলগুলো রেন্ডার করা
  function renderChannels(channels) {
    const listContainer = document.getElementById('channelList');
    listContainer.innerHTML = '';

    if (channels.length === 0) {
      listContainer.innerHTML = '<div style="color:#94a3b8; text-align:center; grid-column: 1/-1; padding: 20px;">কোনো চ্যানেল খুঁজে পাওয়া যায়নি!</div>';
      return;
    }

    // ব্রাউজার যেন হ্যাং না করে, তাই একসাথে ১৫০টি চ্যানেল দেখানো হচ্ছে
    channels.slice(0, 150).forEach(ch => {
      const card = document.createElement('div');
      card.className = 'channel-card';
      
      const iconUrl = ch.stream_icon ? proxy + encodeURIComponent(ch.stream_icon) : '';
      
      card.innerHTML = `
        ${ch.stream_icon ? `<img src="${iconUrl}" loading="lazy" onerror="this.style.display='none'">` : ''}
        <span>${ch.name}</span>
      `;
      card.onclick = () => playChannel(ch.stream_id, ch.name);
      listContainer.appendChild(card);
    });
  }

  // ভিডিও প্লে করার ফাংশন (উন্নত HLS.js কনফিগারেশন সহ)
  function playChannel(streamId, channelName) {
    document.getElementById('currentChannel').textContent = "লোড হচ্ছে: " + channelName;
    
    // m3u8 স্ট্রিম লিংক তৈরি
    const rawStreamUrl = `${server}/live/${user}/${pass}/${streamId}.m3u8`;
    const finalStreamUrl = proxy + encodeURIComponent(rawStreamUrl);
    const video = document.getElementById('video');

    if (hlsInstance) { 
      hlsInstance.destroy(); 
    }

    if (Hls.isSupported()) {
      hlsInstance = new Hls({
        // প্রতিটি ভিডিও সেগমেন্ট (ts file) যেন প্রক্সির মাধ্যমে যায় তার জন্য xhrSetup
        xhrSetup: function(xhr, url) {
          if (!url.startsWith(proxy)) {
             xhr.open('GET', proxy + encodeURIComponent(url), true);
          } else {
             xhr.open('GET', url, true);
          }
        }
      });

      hlsInstance.loadSource(finalStreamUrl);
      hlsInstance.attachMedia(video);
      
      hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
         document.getElementById('currentChannel').textContent = "এখন চলছে: " + channelName;
         video.play().catch(e => console.log("Play error:", e));
      });
      
      // ভিডিও চলাকালীন কোনো এরর আসলে রিকভার করার চেষ্টা
      hlsInstance.on(Hls.Events.ERROR, function (event, data) {
        if (data.fatal) {
          switch (data.type) {
            case Hls.ErrorTypes.NETWORK_ERROR:
              console.log("Network error, trying to recover...");
              hlsInstance.startLoad();
              break;
            case Hls.ErrorTypes.MEDIA_ERROR:
              console.log("Media error, trying to recover...");
              hlsInstance.recoverMediaError();
              break;
            default:
              hlsInstance.destroy();
              document.getElementById('currentChannel').textContent = "প্লে করতে সমস্যা হচ্ছে: " + channelName;
              break;
          }
        }
      });
      
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      // সাফারি বা আইফোনের জন্য নেটিভ সাপোর্ট
      video.src = finalStreamUrl;
      video.addEventListener('loadedmetadata', () => {
         document.getElementById('currentChannel').textContent = "এখন চলছে: " + channelName;
         video.play().catch(e => console.log("Play error:", e));
      });
    }
  }
</script>

</body>
</html>
