<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Xtream Player</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        .channel-item.active {
            background: #ff4d4d !important;
            color: #fff;
            font-weight: bold;
            border-left: 4px solid #fff;
        }
        .external-btn {
            background: #28a745;
            padding: 10px 18px;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h3>লাইভ চ্যানেল</h3>
        <div class="controls">
            <input type="text" id="search-box" placeholder="চ্যানেল খুঁজুন..." onkeyup="filterChannels()">
            <select id="category-select" onchange="filterChannels()">
                <option value="all">সকল ক্যাটাগরি</option>
            </select>
        </div>
        <div id="channel-list">চ্যানেল লোড হচ্ছে...</div>
    </div>

    <div class="main-content">
        <div class="video-container" style="width: 100%; max-width: 800px; text-align: center;">
            <video id="video-player" controls autoplay style="width: 100%; height: 420px; background: #000; border-radius: 8px;"></video>
            <div id="error-message" style="color: #ff4d4d; display: none; margin-top: 15px; font-weight: bold; line-height: 1.6;"></div>
        </div>
    </div>

    <script>
        let allChannels = [];
        let categoriesMap = {};
        const video = document.getElementById('video-player');
        let hls = null;

        async function loadData() {
            try {
                let catRes = await fetch('/api/categories');
                let categories = await catRes.json();
                
                let catSelect = document.getElementById('category-select');
                if(Array.isArray(categories)) {
                    categories.forEach(cat => {
                        categoriesMap[cat.category_id] = cat.category_name;
                        let option = document.createElement('option');
                        option.value = cat.category_id;
                        option.innerText = cat.category_name;
                        catSelect.appendChild(option);
                    });
                }

                let streamRes = await fetch('/api/channels');
                allChannels = await streamRes.json();
                displayChannels(allChannels);

            } catch (err) {
                document.getElementById('channel-list').innerText = "ডেটা লোড করতে সমস্যা হয়েছে।";
            }
        }

        function displayChannels(channels) {
            let listContainer = document.getElementById('channel-list');
            listContainer.innerHTML = '';
            
            if(Array.isArray(channels) && channels.length > 0) {
                channels.forEach(channel => {
                    let div = document.createElement('div');
                    div.className = 'channel-item';
                    div.innerText = channel.name;
                    
                    div.onclick = function() {
                        document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
                        this.classList.add('active');
                        playChannel(channel.stream_id);
                    };
                    
                    listContainer.appendChild(div);
                });
            } else {
                listContainer.innerText = "কোনো চ্যানেল পাওয়া যায়নি।";
            }
        }

        function filterChannels() {
            let searchQuery = document.getElementById('search-box').value.toLowerCase();
            let selectedCat = document.getElementById('category-select').value;

            let filtered = allChannels.filter(channel => {
                let matchesSearch = channel.name.toLowerCase().includes(searchQuery);
                let matchesCat = (selectedCat === 'all' || channel.category_id == selectedCat);
                return matchesSearch && matchesCat;
            });

            displayChannels(filtered);
        }

        function playChannel(streamId) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.style.display = 'none';
            errorDiv.innerHTML = '';
            
            fetch(`/api/play/${streamId}`)
                .then(res => res.json())
                .then(data => {
                    if(data.url) {
                        let streamUrl = data.url;

                        if (Hls.isSupported()) {
                            if (hls) { hls.destroy(); }
                            hls = new Hls();
                            hls.loadSource(streamUrl);
                            hls.attachMedia(video);
                            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                                video.play().catch(e => console.log("Autoplay block:", e));
                            });
                            hls.on(Hls.Events.ERROR, function (event, data) {
                                if (data.fatal) {
                                    errorDiv.innerHTML = `
                                        <strong>ব্রাউজার ব্লকিং বা স্ট্রিমিং এরর (${data.details})</strong><br>
                                        সরাসরি নিচের লিংকে ট্যাপ করে VLC বা অন্য ভিডিও প্লেয়ারে চালান:<br>
                                        <a href="${streamUrl}" target="_blank" class="external-btn">ভিডিও প্লেয়ারে চালু করুন</a>
                                    `;
                                    errorDiv.style.display = 'block';
                                }
                            });
                        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                            video.src = streamUrl;
                            video.play();
                        } else {
                            errorDiv.innerHTML = `
                                HLS সাপোর্টেড নয়।<br>
                                <a href="${streamUrl}" target="_blank" class="external-btn">ভিডিও প্লেয়ারে চালু করুন</a>
                            `;
                            errorDiv.style.display = 'block';
                        }
                    }
                })
                .catch(err => {
                    console.error(err);
                    errorDiv.innerText = "ভিডিও লিংক পেতে সমস্যা হচ্ছে।";
                    errorDiv.style.display = 'block';
                });
        }

        loadData();
    </script>
</body>
</html>
